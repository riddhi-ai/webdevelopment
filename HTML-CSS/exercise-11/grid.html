<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
</head>
<body>
    <div style="display: grid; 
                grid-template-columns: 100px 100px 200px; ">
        <div style="background-color: palevioletred">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p> </div>
    </div>

     <div style="display: grid; grid-template-columns: 100px 100px; margin-top:30px;">
        <div style="background-color: palevioletred">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p> </div>
    </div>

    <div style="display: grid; 
                grid-template-columns: 100px 100px 200px; 
                margin-top: 30px;">
        <div style="background-color: palevioletred;">100px</div>
        <div style="background-color: lightpink;">200px <p>text</p> </div>
        <div style="background-color: lightblue;">200px <p></p> </div>
        <div style="background-color: lightpink;">200px </div>
    </div>

        <div style="display: grid; 
                    grid-template-columns: 100px 1fr ; 
                    margin-top: 30px;">
            <div style="background-color: palevioletred;">100px</div>
            <div style="background-color: lightpink;">1fr </div>
            
        </div>

         <div style="display: grid; 
                    grid-template-columns: 100px 1fr 2fr ; 
                    margin-top: 30px;">
            <div style="background-color: palevioletred;">100px</div>
            <div style="background-color: lightpink;">1fr </div>
            <div style="background-color: palevioletred;">1fr</div>
            
        </div>

</body>
</html>
